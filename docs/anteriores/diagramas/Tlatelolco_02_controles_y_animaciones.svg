<text x="85" y="60.7" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#4A7398">T68  /  COMPUTACIÓN GRÁFICA</text>
<text x="85" y="126.08" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="start" fill="#12263E">Actualización de animaciones</text>
<text x="85" y="178.22" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#455B75">Tres estados independientes; una misma escena y un ciclo de renderizado</text>
<text x="990.0" y="286.06" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">glfwPollEvents() → KeyCallback() / MouseCallback()</text>
<text x="990.0" y="309.82" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">N, B, V conmutan flags; TAB selecciona grupo; P informa posiciones</text>
<text x="990.0" y="402.06" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">DoMovement() mueve cámara (WASD / flechas)</text>
<text x="990.0" y="425.82" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">y grupo seleccionado (J/L, I/K, U/O)</text>
<text x="990.0" y="527.43" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#12263E">Animation() actualiza el estado temporal</text>
<text x="365.0" y="1070.61" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#12263E"></text>
<text x="121" y="646.93" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">MAC · SIERRAS</text>
<text x="990.0" y="1070.61" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#12263E"></text>
<text x="746" y="646.93" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">SENTINEL · DISPAROS</text>
<text x="1615.0" y="1070.61" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#12263E"></text>
<text x="1371" y="646.93" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">CUAU-68 · ESQUIVE</text>
<text x="365.0" y="761.4" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">¿animSierras</text>
<text x="365.0" y="787.8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">activo?</text>
<text x="229.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">rotAspa +=</text>
<text x="229.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">540° · deltaTime</text>
<text x="500.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">Mantener el</text>
<text x="500.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">ángulo actual</text>
<text x="365.0" y="1072.1699999999998" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Transformación de MAC:</text>
<text x="365.0" y="1094.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">traslación + orientación + escala</text>
<text x="365.0" y="1117.05" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">y ajuste del centro local</text>
<text x="365.0" y="1236.18" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Para las 3 sierras:</text>
<text x="365.0" y="1259.94" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">rotaciones alternadas sobre Z</text>
<text x="365.0" y="1283.7" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">según rotAspa</text>
<text x="365.0" y="1410.94" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Dibujar MAC + 3 sierras</text>
<text x="990.0" y="761.4" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">¿animScarface</text>
<text x="990.0" y="787.8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">activo?</text>
<text x="854.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">tScar +=</text>
<text x="854.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">deltaTime</text>
<text x="1125.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">Mantener tScar;</text>
<text x="1125.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">sin disparo</text>
<text x="990.0" y="1072.1699999999998" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Para cada SENTINEL (i = 0..2):</text>
<text x="990.0" y="1094.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">orientación hacia CUAU, barrido,</text>
<text x="990.0" y="1117.05" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">retroceso y destello condicional</text>
<text x="990.0" y="1237.1699999999998" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Un solo punto de luz para el</text>
<text x="990.0" y="1259.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">primer destello activo; en otro</text>
<text x="990.0" y="1282.05" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">caso, luz puntual apagada</text>
<text x="990.0" y="1410.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Dibujar 3 SENTINEL + railguns</text>
<text x="1615.0" y="761.4" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">¿animEsquive</text>
<text x="1615.0" y="787.8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">activo?</text>
<text x="1479.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">tEsq +=</text>
<text x="1479.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">deltaTime</text>
<text x="1750.5" y="914.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">Conservar offset,</text>
<text x="1750.5" y="937.82" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">yaw y tilt</text>
<text x="1615.0" y="1072.1699999999998" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Con seno y coseno calcular:</text>
<text x="1615.0" y="1094.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">zigzag (X/Z), altura del salto,</text>
<text x="1615.0" y="1117.05" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">orientación y ángulo de inclinación</text>
<text x="1615.0" y="1237.1699999999998" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Transformación: traslación con offset,</text>
<text x="1615.0" y="1259.61" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">rotaciones yaw/tilt y escala</text>
<text x="1615.0" y="1282.05" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">(valores previos si está pausado)</text>
<text x="1615.0" y="1410.94" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Dibujar CUAU-68</text>
<text x="990.0" y="1611.23" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">Composición del fotograma: matrices model,</text>
<text x="990.0" y="1636.31" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">uniforms GLSL y llamadas Draw(...)</text>
<text x="1000.0" y="1721.84" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#455B75">Regresar al ciclo principal → glfwSwapBuffers() → comprobar condición del while (página 1)</text>
<text x="92" y="1787.82" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#455B75">NOTA: los disparos son retroceso + destello de luz; no se crean proyectiles. Los tres estados se actualizan secuencialmente.</text>
</svg>
<text x="475" y="1191" font-family="Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#477EA7">SIGUIENTE</text>
<text x="475" y="1208" font-family="Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#477EA7">FOTOGRAMA</text>
<text x="74" y="59.7" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#4A7398">T68  /  COMPUTACIÓN GRÁFICA</text>
<text x="74" y="125.7" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#12263E">Ejecución del programa</text>
<text x="74" y="177.22" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#455B75">Inicialización, ciclo de actualización, renderizado y cierre</text>
<text x="214.0" y="249.95" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">DIAGRAMA DE FLUJO · main()</text>
<text x="830.0" y="315.93" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#12263E">Inicio</text>
<text x="830.0" y="403.22999999999996" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">glfwInit()</text>
<text x="830.0" y="428.30999999999995" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">Crear ventana con glfwCreateWindow()</text>
<text x="830.0" y="531.73" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">¿Se creó</text>
<text x="830.0" y="556.8100000000001" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">la ventana?</text>
<text x="1341.0" y="534.5600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">Error: no se creó la ventana</text>
<text x="1341.0" y="558.32" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">glfwTerminate() · EXIT_FAILURE</text>
<text x="830.0" y="663.89" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Crear contexto actual y obtener tamaño</text>
<text x="830.0" y="686.33" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Callbacks de teclado/ratón; capturar cursor</text>
<text x="830.0" y="799.73" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">¿GLAD se</text>
<text x="830.0" y="824.8100000000001" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">inicializó?</text>
<text x="1341.0" y="804.0600000000001" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">Error: falló la carga de GLAD</text>
<text x="1341.0" y="827.82" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#12263E">EXIT_FAILURE (sin glfwTerminate)</text>
<text x="830.0" y="931.6800000000001" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">glViewport() · Shader de iluminación</text>
<text x="830.0" y="955.44" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Cargar Plaza, CUAU, SENTINEL, Railgun,</text>
<text x="830.0" y="979.2" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">MAC y Aspa (modelos OBJ)</text>
<text x="830.0" y="1065.56" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Uniforms de texturas y matriz</text>
<text x="830.0" y="1089.32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">de proyección (glm::perspective)</text>
<text x="830.0" y="1194.73" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">¿Continúa abierta</text>
<text x="830.0" y="1219.81" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">la ventana?</text>
<text x="1340.0" y="1200.3999999999999" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">glfwTerminate()</text>
<text x="1340.0" y="1226.8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#12263E">return 0</text>
<text x="830.0" y="1323.56" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">glfwGetTime() → deltaTime</text>
<text x="830.0" y="1347.32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Actualizar lastFrame</text>
<text x="830.0" y="1437.56" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">glfwPollEvents() · DoMovement()</text>
<text x="830.0" y="1461.32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Animation() actualiza estados y tiempos</text>
<text x="830.0" y="1558.56" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Limpiar buffers y activar profundidad</text>
<text x="830.0" y="1582.32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#12263E">Shader, cámara, iluminación y transformaciones</text>
<text x="830.0" y="1681.3899999999999" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">Dibujar plaza, CUAU, 3 SENTINEL + railguns</text>
<text x="830.0" y="1703.83" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#12263E">MAC y sus 3 sierras (matrices individuales)</text>
<text x="830.0" y="1801.27" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#12263E">glfwSwapBuffers(window)</text>
<text x="113" y="712" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#455B75">CONFIGURACIÓN INICIAL</text>
<text x="113" y="762" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Las rutas de los recursos son relativas.</text>
<text x="113" y="787" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Shader/lighting.vs y lighting.frag;</text>
<text x="113" y="812" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Model carga archivos OBJ mediante</text>
<text x="113" y="837" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Assimp y sus materiales.</text>
<text x="1136" y="934" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#455B75">CONTROLES DURANTE EL CICLO</text>
<text x="1136" y="984" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Teclado y ratón actualizan la cámara</text>
<text x="1136" y="1009" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">y los modelos. N, B y V cambian</text>
<text x="1136" y="1034" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">los estados de las tres animaciones.</text>
<text x="1136" y="1059" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">El procesamiento ocurre por fotograma.</text>
<text x="1136" y="1469" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#455B75">DIBUJO DE SENTINEL</text>
<text x="1136" y="1519" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">Para i = 0, 1 y 2 se calcula el barrido,</text>
<text x="1136" y="1544" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">retroceso y posible destello. Una única</text>
<text x="1136" y="1569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">luz puntual representa el primer</text>
<text x="1136" y="1594" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">destello activo del fotograma.</text>
<text x="112" y="1554" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#455B75">ORDEN DEL FOTOGRAMA</text>
<text x="112" y="1604" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">El programa actualiza el tiempo,</text>
<text x="112" y="1629" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">procesa eventos y animaciones</text>
<text x="112" y="1654" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">antes de configurar la iluminación</text>
<text x="112" y="1679" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#455B75">y emitir las llamadas de dibujo.</text>
<text x="72" y="1905.94" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#455B75">FLUJO VALIDADO CONTRA EL CÓDIGO · El bucle verifica la condición al inicio de cada iteración.</text>
</svg>